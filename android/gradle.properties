org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The pub cache (C:\Users\...) and this project (D:\natco_app) sit on
# different Windows drive letters. Kotlin's incremental compiler tries to
# express plugin source paths (e.g. file_picker's Android sources) relative
# to the build directory, and a relative path across two drive roots is
# undefined on Windows — the compiler throws
# "this and base files have different roots" and the release build fails.
# Disabling incremental compilation avoids the relativization entirely; it
# only costs a slower from-scratch Kotlin compile, not a functional change.
kotlin.incremental=false
