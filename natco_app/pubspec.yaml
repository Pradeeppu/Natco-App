name: natco_app
description: >-
  NATCO Assessment App — offline-first, field-ready OMR assessment data
  pipeline for school-based educational assessments.
publish_to: 'none'

# versionName+versionCode for Android.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # ---- Backend (kept behind our own abstractions; see docs/01-architecture.md)
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  cloud_functions: ^6.4.0
  firebase_crashlytics: ^5.3.0

  # ---- State management & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # ---- Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ---- Local storage (offline-first)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^11.0.0

  # ---- Connectivity: interface state + actual reachability (both needed)
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^3.1.2

  # ---- OMR capture & pure-Dart image processing
  camera: ^0.12.1
  image_picker: ^1.2.3
  image: ^4.9.2
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^13.0.2

  # ---- Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  csv: ^8.0.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Used directly (not just transitively via flutter_riverpod) by the widget
  # test harness, for the `Override` type used in provider override lists.
  riverpod: ^3.4.3

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  hive_ce_generator: ^1.11.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/omr_templates/
